parameters:
  collect_on_delivery.method.identifier_prefix.collect_on_delivery: 'collect_on_delivery'

services:
  collect_on_delivery.generator.collect_on_delivery_config_identifier:
    parent: oro_integration.generator.prefixed_identifier_generator
    public: true
    arguments:
      - '%collect_on_delivery.method.identifier_prefix.collect_on_delivery%'

  collect_on_delivery.integration.channel:
    class: Training\Bundle\CollectOnDeliveryBundle\Integration\CollectOnDeliveryChannelType
    public: true
    tags:
      - { name: oro_integration.channel, type: collect_on_delivery }

  collect_on_delivery.integration.transport:
    class: Training\Bundle\CollectOnDeliveryBundle\Integration\CollectOnDeliveryTransport
    public: true
    tags:
      - { name: oro_integration.transport, type: collect_on_delivery, channel_type: collect_on_delivery }

  collect_on_delivery.factory.collect_on_delivery_config:
    class: Training\Bundle\CollectOnDeliveryBundle\PaymentMethod\Config\Factory\CollectOnDeliveryConfigFactory
    public: false
    arguments:
      - '@oro_locale.helper.localization'
      - '@collect_on_delivery.generator.collect_on_delivery_config_identifier'

  collect_on_delivery.payment_method.config.provider:
    class: Training\Bundle\CollectOnDeliveryBundle\PaymentMethod\Config\Provider\CollectOnDeliveryConfigProvider
    arguments:
      - '@doctrine'
      - '@collect_on_delivery.factory.collect_on_delivery'
      - '@logger'

  collect_on_delivery.payment_method_view_provider.collect_on_delivery:
    class: Training\Bundle\CollectOnDeliveryBundle\PaymentMethod\View\Provider\CollectOnDeliveryViewProvider
    public: false
    arguments:
      - '@collect_on_delivery.payment_method.config.provider'
      - '@collect_on_delivery.factory.method_view.collect_on_delivery'
    tags:
      - { name: oro_payment.payment_method_view_provider }

  collect_on_delivery.factory.method.collect_on_delivery:
    class: Training\Bundle\CollectOnDeliveryBundle\PaymentMethod\Factory\CollectOnDeliveryPaymentMethodFactory
    public: false